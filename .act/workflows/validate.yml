name: Local validation

# This file is run by local act only. GitHub Actions is disabled for this repo.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/workflow-monitoring-act-go-cache
      GOMODCACHE: /tmp/workflow-monitoring-act-go-mod-cache
      UV_CACHE_DIR: /tmp/workflow-monitoring-act-uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/workflow-monitoring-act-venv
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed Python lockfile
        run: uv lock --check
      - name: Install committed Python environment
        run: uv sync --locked
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Run Python lint checks
        run: uv run ruff check .
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Check Go CLI
        run: |
          golangci-lint fmt --diff ./...
          golangci-lint run ./...
          go test ./...
      - name: Test CLI with the Python validator
        run: |
          go build -trimpath -o /tmp/workflow-monitoring ./cmd/workflow-monitoring
          /tmp/workflow-monitoring --config /tmp/workflow-monitoring.yml init --force
          /tmp/workflow-monitoring --config /tmp/workflow-monitoring.yml add \
            --job-id 42 \
            --status active \
            --completion-time 06:00
          # #24 deletes this step together with the Go CLI.
          uv run python -c "from pathlib import Path; from src.workflow_monitoring_config import load_workflow_monitoring_configuration as load; load(Path('/tmp/workflow-monitoring.yml'), Path('src/workflow-monitoring.schema.json'))"
      - name: Snapshot built dashboard
        run: cp src/dashboards/workflow-monitoring.lvdash.json /tmp/workflow-monitoring.lvdash.json
      - name: Build dashboard
        # The build must be current, so the tracked scaffold and Vega files match the dashboard.
        run: |
          uv run python scripts/build_dashboard.py
      - name: Check built dashboard
        run: cmp /tmp/workflow-monitoring.lvdash.json src/dashboards/workflow-monitoring.lvdash.json
      - name: Validate dashboard JSON
        run: jq empty src/dashboards/workflow-monitoring.lvdash.json
      - name: Check banned em dash
        # Build the character from bytes so this file does not contain it itself.
        run: |
          banned_character="$(printf '\342\200\224')"
          test -z "$(rg -l "$banned_character" --hidden --glob '!.git/**' .)"
