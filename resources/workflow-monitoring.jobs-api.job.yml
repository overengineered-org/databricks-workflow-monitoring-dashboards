# Generated by workflow_monitoring_dashboard.py. Do not edit.
resources:
  jobs:
    workflow_monitoring_jobs_api_collector:
      name: ${var.dashboard_display_name} Jobs API collector
      description: Polls configured Lakeflow Jobs into managed Delta tables, then
        refreshes the monitoring dashboard.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0/5 * * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
      - task_key: collect_jobs_api_state
        notebook_task:
          notebook_path: ../src/collect_workflow_monitoring_jobs_api.py
          base_parameters:
            catalog_name: workflow_monitoring
            schema_name: lakeflow_jobs
            create_catalog_and_schema_if_missing: 'false'
            workspace_id: '1234567890123456'
            monitored_job_ids_json: '[]'
        timeout_seconds: 240
        max_retries: 2
        min_retry_interval_millis: 30000
      - task_key: refresh_workflow_monitoring_dashboard
        depends_on:
        - task_key: collect_jobs_api_state
        run_if: ALL_DONE
        dashboard_task:
          dashboard_id: ${resources.dashboards.workflow_monitoring.id}
          warehouse_id: ${var.warehouse_id}
