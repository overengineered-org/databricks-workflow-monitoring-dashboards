# yaml-language-server: $schema=./schema/workflow-monitoring.schema.json

# Copy this template to workflow-monitoring.yml before adding the Lakeflow jobs you monitor.
version: 2

# Choose one source explicitly. system_tables is read-only and may be delayed.
monitoring_data_source_config:
  source: system_tables

# For five-minute Jobs API polling, replace the block above with:
# monitoring_data_source_config:
#   source: jobs_api
#   storage:
#     catalog: workflow_monitoring
#     schema: lakeflow_jobs
# Find this numeric ID with `databricks auth describe --profile <name>`.
workspace_id: "1234567890123456"
# A workflow can override this with sla.timezone.
default_timezone: UTC

workflows:
  # Keep this example inactive until it is replaced with a real workflow.
  - job_name: replace-with-your-workflow-name
    monitoring_status: inactive
    sla:
      frequency: daily
      completion_time: "06:00"
