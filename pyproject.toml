[project]
name = "databricks-jobs-monitoring-dashboard"
version = "0.2.0"
description = "Generate a Jobs API-backed Databricks dashboard for workflow SLA, reliability, and trends."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "databricks",
    "lakeflow-jobs",
    "job-monitoring",
    "sla-monitoring",
    "workflow-dashboard",
    "jobs-api",
]
dependencies = [
    "jsonschema>=4.26.0,<5.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2,<0.18.0",
]

# Keep formatting and lint rules small. Tests use Python's standard library.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
