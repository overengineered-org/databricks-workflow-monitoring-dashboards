[project]
name = "databricks-workflow-monitoring-dashboards"
version = "0.1.0"
description = "Generate a Databricks jobs monitoring dashboard for workflow SLA, reliability, trends, and cost."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "databricks",
    "lakeflow-jobs",
    "job-monitoring",
    "sla-monitoring",
    "workflow-dashboard",
    "finops",
]
dependencies = [
    "jsonschema>=4.26.0,<5.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3,<0.17.0",
]

# Keep formatting and lint rules small. Tests use Python's standard library.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
