resources:
  jobs:
    fast_logistics_on_time:
      name: "[${bundle.target}] Fast Logistics On Time"
      max_concurrent_runs: 1
      queue:
        enabled: false
      schedule:
        quartz_cron_expression: "0 0 0,6,12,18 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: run_on_time
          timeout_seconds: 60
          notebook_task:
            notebook_path: ../src/fast_logistics_workflow.py
            source: WORKSPACE
            base_parameters:
              scenario: on_time

    fast_logistics_recovery:
      name: "[${bundle.target}] Fast Logistics Recovery"
      max_concurrent_runs: 1
      queue:
        enabled: false
      parameters:
        - name: run_mode
          default: scheduled
      schedule:
        quartz_cron_expression: "0 0 1,7,13,19 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: run_recovery
          timeout_seconds: 60
          notebook_task:
            notebook_path: ../src/fast_logistics_workflow.py
            source: WORKSPACE
            base_parameters:
              scenario: recovery
              run_mode: "{{job.parameters.run_mode}}"

    fast_logistics_late_delivery:
      name: "[${bundle.target}] Fast Logistics Late Delivery"
      max_concurrent_runs: 1
      queue:
        enabled: false
      schedule:
        quartz_cron_expression: "0 0 2,8,14,20 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: run_late_delivery
          timeout_seconds: 60
          notebook_task:
            notebook_path: ../src/fast_logistics_workflow.py
            source: WORKSPACE
            base_parameters:
              scenario: late_delivery

    fast_logistics_duration:
      name: "[${bundle.target}] Fast Logistics Duration"
      max_concurrent_runs: 1
      queue:
        enabled: false
      schedule:
        quartz_cron_expression: "0 0 3,9,15,21 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: run_duration
          timeout_seconds: 60
          notebook_task:
            notebook_path: ../src/fast_logistics_workflow.py
            source: WORKSPACE
            base_parameters:
              scenario: duration
