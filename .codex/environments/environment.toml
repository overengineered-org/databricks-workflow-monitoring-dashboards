# Codex app set-up for new worktrees. Every command is a shared script that any tool can run.
version = 1
name = "databricks-jobs-monitoring-dashboard"

[setup]
script = "uv sync --locked"

[[actions]]
name = "Fast checks"
icon = "tool"
command = "scripts/check.sh"

[[actions]]
name = "Full local gate"
icon = "tool"
command = "scripts/run-local-validation.sh"
