name: Reusable workflow
on: workflow_dispatch
jobs:
  runner-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/check_workflow_runners.py
  validate:
    needs: runner-guard
    uses: example/example/.github/workflows/validate.yml@main
