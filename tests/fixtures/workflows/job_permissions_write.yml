name: Job write in another file
on: push
permissions:
  contents: read
jobs:
  runner-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/check_workflow_runners.py
  release:
    needs: runner-guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: echo publish
