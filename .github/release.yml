changelog:
  exclude:
    labels:
      - duplicate
      - wontfix
  categories:
    - title: Upgrade steps
      labels:
        - upgrade-steps
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
