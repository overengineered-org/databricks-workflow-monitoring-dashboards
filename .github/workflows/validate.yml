name: Local validation

# GitHub runs this gate for pull requests and pushes to main. GitHub-hosted
# runners are free for public repositories. scripts/run-local-validation.sh runs
# the same file with act.
#
# Cost guardrails: every job uses exactly ubuntu-latest. Never use a
# non-standard runner, a runner group, labels, or a self-hosted runner. Never
# add repository secrets, target pull request triggers, artifact uploads, or
# paid actions.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check workflow runners
        run: python3 scripts/check_workflow_runners.py

  validate:
    needs: runner-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: /tmp/workflow-monitoring-act-go-cache
      GOMODCACHE: /tmp/workflow-monitoring-act-go-mod-cache
      UV_CACHE_DIR: /tmp/workflow-monitoring-act-uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/workflow-monitoring-act-venv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        if: ${{ !env.ACT }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.2"
      - name: Install Databricks CLI
        if: ${{ !env.ACT }}
        uses: databricks/setup-cli@6bb7075f85b326f8b9ce160933dfe9bcd63c8121 # v1.13.0
        with:
          version: "1.13.0"
      - name: Verify committed Python lockfile
        run: uv lock --check
      - name: Install committed Python environment
        run: uv sync --locked
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Run Python lint checks
        run: uv run ruff check .
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Snapshot built dashboard
        run: cp src/dashboards/workflow-monitoring.lvdash.json /tmp/workflow-monitoring.lvdash.json
      - name: Build dashboard
        # The build must be current, so the tracked scaffold and Vega files match the dashboard.
        run: |
          uv run python scripts/build_dashboard.py
      - name: Check built dashboard
        run: cmp /tmp/workflow-monitoring.lvdash.json src/dashboards/workflow-monitoring.lvdash.json
      - name: Check built template
        # The template product copy must be current, so adopters get the reviewed files.
        run: uv run python scripts/build_template.py --check
      - name: Validate dashboard JSON
        run: jq empty src/dashboards/workflow-monitoring.lvdash.json
      - name: Check banned em dash
        # Build the character from bytes so this file does not contain it itself.
        # grep exits 1 for no match and 2 for an error. Only exit 1 may pass.
        run: |
          banned_character="$(printf '\342\200\224')"
          command -v grep >/dev/null || { echo "grep is required for the em dash check" >&2; exit 1; }
          set +e
          grep -rIl --exclude-dir=.git "$banned_character" .
          status=$?
          set -e
          if [[ "$status" -gt 1 ]]; then
            echo "grep exited with code $status" >&2
            exit 1
          fi
          if [[ "$status" -eq 0 ]]; then
            echo "banned em dash found in the files above" >&2
            exit 1
          fi
