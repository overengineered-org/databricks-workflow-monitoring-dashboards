name: Local validation

# GitHub runs this gate for pull requests and pushes to main. GitHub-hosted
# runners are free for public repositories. scripts/run-local-validation.sh runs
# the same file with act.
#
# Cost guardrails: every job uses exactly ubuntu-latest. Never use a
# non-standard runner, a runner group, labels, or a self-hosted runner. Never
# add repository secrets, target pull request triggers, artifact uploads, or
# paid actions.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow runners
        run: python3 scripts/check_workflow_runners.py

  validate:
    needs: runner-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: /tmp/workflow-monitoring-act-uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/workflow-monitoring-act-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: ${{ !env.ACT }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Run fast checks
        # scripts/check.sh is the one source of these checks, for agents, humans, and CI.
        run: scripts/check.sh
