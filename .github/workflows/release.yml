name: Release

# This workflow publishes the GitHub Release when a merge to main changes the
# version and v<version> has no tag yet. The release job is the only job in
# this repository that may write contents. scripts/release.sh --publish is the
# manual fallback when this workflow fails.
#
# Cost guardrails: every job uses exactly ubuntu-latest. Never use a
# non-standard runner, a runner group, labels, or a self-hosted runner. Never
# add repository secrets, target pull request triggers, artifact uploads, or
# paid actions.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  runner-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow runners
        run: python3 scripts/check_workflow_runners.py

  release:
    needs: runner-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The Databricks CLI keeps the same pin as validate.yml, so the publish job
      # renders the template with the same CLI version as the pull request gate.
      - name: Install Databricks CLI
        if: ${{ !env.ACT }}
        uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
        with:
          version: "1.22.1"
      - name: Install gitleaks
        if: ${{ !env.ACT }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version
      - name: Publish release on merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --publish-on-merge
