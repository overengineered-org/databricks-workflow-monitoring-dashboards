name: Feature request
description: Propose a change to the dashboard, collector, wrapper, or bundle.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to see or do that you cannot today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Name any config field, table, or dashboard page it changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other options that you considered.
